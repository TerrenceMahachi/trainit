<div class="auth-container">
    <div class="auth-card">
        <img src="img/logo-badge.svg" alt="Tsigiro" class="auth-logo-badge">
        <h2 class="auth-title">Welcome to Tsigiro</h2>
        <p class="auth-subtitle">The secure shared portal for Tsigiro clients, staff and approved professionals.</p>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Sign In
            </button>
            <button type="button" class="auth-tab" id="tab-register">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px; margin-right: 4px;"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Create Account
            </button>
        </div>

        <!-- Login Form -->
        <form id="mobile-login-form">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="name@tsigiro.co.zw" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="btn-toggle-password" data-target="login-password" title="Show or hide password">
                        <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="btn-submit-login" class="btn-primary">Sign In</button>

            <!-- Prominent New Account Option -->
            <div class="auth-separator">
                <span>NEW TO TSIGIRO?</span>
            </div>

            <button type="button" id="btn-goto-register" class="btn-outline-action">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                Create New Account
            </button>

            <div class="auth-footer-prompt">
                <span>Don't have an account?</span>
                <a href="javascript:void(0)" id="link-goto-register" class="auth-link-bold">Sign up here &rarr;</a>
            </div>
        </form>

        <!-- Auto-Registration Form (Streamlined: No Account Type, with Show Password & Robot Verification) -->
        <form id="mobile-register-form" style="display: none;">
            <div class="form-group">
                <label class="form-label" for="reg-name">Full Legal Name</label>
                <input type="text" id="reg-name" class="form-input" placeholder="e.g. Farai Chikwanha" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-email">Email Address</label>
                <input type="email" id="reg-email" class="form-input" placeholder="name@domain.co.zw" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-password">Create Password</label>
                <div class="password-input-wrap">
                    <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
                    <button type="button" class="btn-toggle-password" data-target="reg-password" title="Show or hide password">
                        <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="reg-robot-answer">Verification: I am not a robot</label>
                <div class="robot-question-row">
                    <div class="robot-question-box">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#159b75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect x="3" y="11" width="18" height="10" rx="2"></rect><circle cx="12" cy="5" r="2"></circle><path d="M12 7v4"></path><line x1="8" y1="16" x2="8" y2="16"></line><line x1="16" y1="16" x2="16" y2="16"></line></svg>
                        <span id="robot-math-question">5 + 3 =</span>
                    </div>
                    <input type="number" id="reg-robot-answer" class="form-input robot-input" placeholder="Answer" required>
                    <button type="button" id="btn-refresh-robot" class="btn-refresh-captcha" title="New math question">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </button>
                </div>
            </div>
            <button type="submit" id="btn-submit-register" class="btn-primary">Create Account & Continue &rarr;</button>

            <div class="auth-separator">
                <span>ALREADY REGISTERED?</span>
            </div>

            <button type="button" id="btn-goto-login" class="btn-outline-action">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                Sign In to Existing Account
            </button>
        </form>

        <div class="quick-login-section">
            <div class="quick-login-title">Quick Demo Sign-In (1-Click)</div>
            <div class="quick-chips-grid">
                <button type="button" class="chip-btn" data-quick="client">
                    <span class="chip-name">Client User</span>
                    <span class="chip-role">EcoSolutions</span>
                </button>
                <button type="button" class="chip-btn" data-quick="associate">
                    <span class="chip-name">Associate</span>
                    <span class="chip-role">Cloud Specialist</span>
                </button>
                <button type="button" class="chip-btn" data-quick="apprentice">
                    <span class="chip-name">Apprentice</span>
                    <span class="chip-role">NUST Engineering</span>
                </button>
                <button type="button" class="chip-btn" data-quick="candidate">
                    <span class="chip-name">Candidate</span>
                    <span class="chip-role">Applicant</span>
                </button>
                <button type="button" class="chip-btn" data-quick="manager">
                    <span class="chip-name">Service Mgr</span>
                    <span class="chip-role">Triage & SLA</span>
                </button>
                <button type="button" class="chip-btn" data-quick="admin">
                    <span class="chip-name">Sys Admin</span>
                    <span class="chip-role">Executive Command</span>
                </button>
            </div>
        </div>
    </div>
</div>
