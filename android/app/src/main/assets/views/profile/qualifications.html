<div class="view">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;">
        <button type="button" id="btn-back-to-profile-from-quals" class="btn-link-action" style="font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; gap: 6px;">
            ← Back to Profile
        </button>
        <span id="quals-count-badge" class="status-pill status-pill-pending" style="font-size: 0.72rem;">0 Qualifications</span>
    </div>

    <!-- Header Banner -->
    <div class="card" style="margin-bottom: 14px; background: #ffffff; border: 1px solid var(--border);">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; border-radius: 12px; background: rgba(21, 155, 117, 0.12); display: flex; align-items: center; justify-content: center; font-size: 1.3rem;">
                    🎓
                </div>
                <div>
                    <h3 style="font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin: 0 0 2px 0;">Qualifications &amp; Education</h3>
                    <p style="font-size: 0.75rem; color: var(--text-muted); margin: 0;">Degrees, diplomas &amp; certifications for 1-Click review.</p>
                </div>
            </div>
            <button type="button" id="btn-show-add-qual" class="btn-primary" style="width: auto; padding: 7px 14px; font-size: 0.76rem; font-weight: 700; margin: 0; background: var(--primary);">
                + Add
            </button>
        </div>
    </div>

    <!-- Add / Edit Qualification Card (Hidden by default, shown on click) -->
    <div id="qual-form-card" class="card" style="display: none; padding: 18px 16px; margin-bottom: 16px; border: 1px solid var(--border); background: #ffffff; border-radius: 12px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
            <h4 id="qual-form-title" style="margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--primary);">Add New Qualification</h4>
            <button type="button" id="btn-cancel-qual-form" class="btn-link-action" style="font-size: 0.78rem; color: var(--text-muted);">✕ Cancel</button>
        </div>

        <div id="qual-alert" class="alert-box" style="display: none; margin-bottom: 12px;"></div>

        <form id="qual-form" onsubmit="return false;">
            <input type="hidden" id="qual-id" value="">

            <div class="form-group" style="margin-bottom: 12px;">
                <label class="form-label" for="qual-title" style="font-size: 0.78rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px;">Qualification / Degree Title *</label>
                <input type="text" id="qual-title" class="form-input" required placeholder="e.g. BSc Honours Computer Science">
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label class="form-label" for="qual-institution" style="font-size: 0.78rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px;">Institution / College / University *</label>
                <input type="text" id="qual-institution" class="form-input" required placeholder="e.g. University of Zimbabwe">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
                <div class="form-group" style="margin: 0;">
                    <label class="form-label" for="qual-field" style="font-size: 0.78rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px;">Field of Study</label>
                    <input type="text" id="qual-field" class="form-input" placeholder="e.g. Software Engineering">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label class="form-label" for="qual-type" style="font-size: 0.78rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px;">Type / Level</label>
                    <select id="qual-type" class="form-input">
                        <!-- Loaded dynamically -->
                    </select>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 16px;">
                <label class="form-label" for="qual-date" style="font-size: 0.78rem; font-weight: 700; color: var(--text-main); display: block; margin-bottom: 6px;">Date / Year Obtained</label>
                <input type="date" id="qual-date" class="form-input">
            </div>

            <button type="button" id="btn-save-qual" class="btn-primary" style="margin-top: 4px; font-weight: 700;">
                Save Qualification Record
            </button>
        </form>
    </div>

    <!-- Qualifications List Container -->
    <div id="quals-list-container" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="text-align: center; padding: 24px 10px; color: var(--text-muted); font-size: 0.82rem;">
            Loading qualifications...
        </div>
    </div>
</div>
