<div class="view">
    <div style="margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;">
        <a href="#" id="btn-back-requests" class="section-link">← Back to Ledger</a>
        <button type="button" id="btn-open-log-time" class="btn-primary" style="display: none; width: auto; padding: 6px 12px; font-size: 0.75rem; margin-top: 0; background: #10b981;">
            + Log Hours
        </button>
    </div>

    <!-- Ticket Summary Card -->
    <div class="card">
        <div class="item-header">
            <span id="ticket-number" class="item-code">REQ-0000</span>
            <span id="ticket-status-badge" class="badge badge-blue">Status</span>
        </div>
        <h3 id="ticket-title" class="item-title" style="font-size: 1.1rem; margin-top: 4px;">Request Title</h3>
        <p id="ticket-desc" style="font-size: 0.85rem; color: #475569; margin: 8px 0 12px; line-height: 1.4;"></p>

        <div style="border-top: 1px solid var(--border); padding-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.75rem; color: #64748b;">
            <div>Client: <strong id="ticket-client" style="color: #0f172a;">--</strong></div>
            <div>Priority: <strong id="ticket-priority" style="color: #0f172a;">--</strong></div>
            <div>Target Due: <strong id="ticket-due" style="color: #0f172a;">--</strong></div>
            <div>Requester: <strong id="ticket-requester" style="color: #0f172a;">--</strong></div>
        </div>
    </div>

    <!-- Assigned Specialists -->
    <div id="assigned-specialists-section" class="card" style="display: none; padding: 12px 16px;">
        <div style="font-size: 0.75rem; font-weight: 700; color: #64748b; margin-bottom: 6px; text-transform: uppercase;">Assigned Team</div>
        <div id="assigned-specialists-list" style="font-size: 0.82rem; color: #0f172a;"></div>
    </div>

    <!-- Conversation Stream -->
    <div class="section-title" style="margin-top: 8px;">
        <span>Collaboration Discussion</span>
    </div>

    <div id="thread-container" class="thread-container">
        <div class="empty-state" style="padding: 16px;">
            <p>Loading messages...</p>
        </div>
    </div>

    <!-- Message Composer -->
    <form id="composer-form" class="composer-box">
        <input type="text" id="composer-input" class="composer-input" placeholder="Write a message..." required>
        <button type="submit" id="btn-send-message" class="composer-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </form>

    <!-- Modal Sheet: Log Time Entry -->
    <div id="modal-log-time" class="modal-backdrop" style="display: none;">
        <div class="modal-sheet">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="font-size: 1.05rem; font-weight: 700;">Record Rendered Hours</h3>
                <button type="button" id="btn-close-log-time" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #64748b;">✕</button>
            </div>
            <form id="form-log-time">
                <div class="form-group">
                    <label class="form-label" for="time-hours">Hours Rendered</label>
                    <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                        <button type="button" class="filter-pill hour-chip" data-hour="1.0">1.0h</button>
                        <button type="button" class="filter-pill hour-chip" data-hour="2.0">2.0h</button>
                        <button type="button" class="filter-pill hour-chip" data-hour="4.0">4.0h</button>
                        <button type="button" class="filter-pill hour-chip" data-hour="8.0">8.0h</button>
                    </div>
                    <input type="text" inputmode="decimal" id="time-hours" class="form-input" placeholder="e.g. 2.5" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="time-category">Activity Category</label>
                    <select id="time-category" class="form-input">
                        <option value="3" selected>Billable Client Delivery</option>
                        <option value="2">Client Request Triage</option>
                        <option value="4">Systems & IT Infrastructure</option>
                        <option value="6">Internal Administration</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="time-date">Work Date</label>
                    <input type="date" id="time-date" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="time-summary">Task Description & Deliverables</label>
                    <input type="text" id="time-summary" class="form-input" placeholder="e.g. Ingress SSL configuration & testing" required>
                </div>
                <button type="submit" id="btn-save-time" class="btn-primary" style="background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);">Save Time Entry</button>
            </form>
        </div>
    </div>
</div>
