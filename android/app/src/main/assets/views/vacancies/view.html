<div class="view">

    <div class="card">

        <h2 id="vac-title" class="item-title" style="font-size: 1.15rem; margin-top: 4px;">Job Title</h2>

        <div style="border-top: 1px solid var(--border); padding-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.75rem; color: #64748b;">

    <div class="card">

        <div class="card-title" style="font-size: 0.9rem;">Key Responsibilities</div>
        <div id="vac-resp" style="font-size: 0.82rem; color: #475569; line-height: 1.4; white-space: pre-line; margin-bottom: 12px;"></div>

        <div id="vac-reqs" style="font-size: 0.82rem; color: #475569; line-height: 1.4; white-space: pre-line;"></div>

    <!-- Express Apply Action -->
    <div class="card" style="text-align: center; padding: 18px;">
        <button type="button" id="btn-express-apply" class="btn-primary" style="margin-top: 0;">

        <p style="font-size: 0.72rem; color: #64748b; margin-top: 8px;">Applies with your verified Tsigiro candidate profile and uploaded credentials.</p>
    </div>
